name: KiBot

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kibot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Run ERC & DRC only (skip output generation).
      # continue-on-error keeps the job green so merges are never blocked.
      - name: ERC & DRC
        id: checks
        continue-on-error: true
        uses: INTI-CMNB/KiBot@v2_k10
        with:
          config: pace-core/.kibot.yaml
          dir: pace-core/output
          schema: pace-core/pace-core.kicad_sch
          board: pace-core/pace-core.kicad_pcb
          skip: gerbers,drill,fab_zip,bom,position

      - name: Annotate check failure
        if: steps.checks.outcome == 'failure'
        run: echo "::warning::ERC/DRC checks failed — review the run log for details"

      # Generate outputs regardless of check result.
      - name: Generate outputs
        uses: INTI-CMNB/KiBot@v2_k10
        with:
          config: pace-core/.kibot.yaml
          dir: pace-core/output
          schema: pace-core/pace-core.kicad_sch
          board: pace-core/pace-core.kicad_pcb
          additional_args: --skip-check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fab-outputs
          path: pace-core/output/
          if-no-files-found: warn
