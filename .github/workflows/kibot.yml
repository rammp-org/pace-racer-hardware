name: KiBot

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kibot:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/inti-cmnb/kicad_auto:Ki9_latest

    steps:
      - uses: actions/checkout@v4

      # Run ERC & DRC only (skip output generation).
      # continue-on-error keeps the job green so merges are never blocked.
      - name: ERC & DRC
        id: checks
        continue-on-error: true
        working-directory: pace-core
        run: kibot -c .kibot.yaml -s gerbers,drill,fab_zip,bom,position

      - name: Annotate check failure
        if: steps.checks.outcome == 'failure'
        run: echo "::warning::ERC/DRC checks failed — review the run log for details"

      # Generate outputs regardless of check result.
      - name: Generate outputs
        working-directory: pace-core
        run: kibot --skip-check -c .kibot.yaml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fab-outputs
          path: pace-core/output/
          if-no-files-found: warn
