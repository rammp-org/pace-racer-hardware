name: Hardware CI

on:
  push:
    branches: [main]
    tags: ['V*R*']
  pull_request:

permissions:
  contents: write   # needed to attach release assets on tag builds

jobs:
  build:
    name: ERC, DRC and outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # git describe needs tags

      # ERC + DRC are blocking. Warnings are reported but do not fail the job;
      # known warnings are listed in docs/errata.md.
      - name: ERC and DRC
        uses: INTI-CMNB/KiBot@v2_k10
        with:
          config: pace-core/.kibot.yaml
          dir: pace-core/output
          schema: pace-core/pace-core.kicad_sch
          board: pace-core/pace-core.kicad_pcb
          skip: all

      - name: Generate outputs
        uses: INTI-CMNB/KiBot@v2_k10
        with:
          config: pace-core/.kibot.yaml
          dir: pace-core/output
          schema: pace-core/pace-core.kicad_sch
          board: pace-core/pace-core.kicad_pcb
          skip: run_erc,run_drc

      - name: Check README generated sections are current
        run: |
          python3 tools/gen_readme.py --netlist pace-core/output/meta/*.net --readme README.md --check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pace-racer-${{ github.sha }}
          path: pace-core/output/
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/V')
        uses: softprops/action-gh-release@v2
        with:
          name: PACE Racer ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            pace-core/output/fab/*
            pace-core/output/docs/*
            pace-core/output/mech/*
            pace-core/output/renders/*
