# KiBot configuration for PACE Racer.
# Everything under pace-core/output/ is generated from this file by CI.
# Local run (needs docker), from the repo root:
#   docker run --rm -v "$PWD":/work -w /work ghcr.io/inti-cmnb/kicad10_auto_full:latest \
#     kibot -c pace-core/.kibot.yaml -e pace-core/pace-core.kicad_sch -b pace-core/pace-core.kicad_pcb -d pace-core/output
# KiBot rewrites pace-core.kicad_pcb (zone fill) and pace-core.kicad_pro (REV)
# during a run. After a local run, restore them:
#   git checkout -- pace-core/pace-core.kicad_pcb pace-core/pace-core.kicad_pro
kibot:
  version: 1

globals:
  # %r is the title-block revision, which resolves ${REV} from the project text variables.
  output: '%f-%r-%i.%x'
  dir: output

preflight:
  # REV is injected from the git tag on release builds; PR builds get a
  # describe string such as V1R2-3-gabcdef so every artifact is traceable.
  set_text_variables:
    - name: REV
      command: 'git describe --tags --match "V*R*" --always --dirty'
    - name: GIT_SHA
      command: 'git rev-parse --short HEAD'
  erc:
    warnings_as_errors: false
    format: [HTML, JSON]
  drc:
    warnings_as_errors: false
    schematic_parity: true
    format: [HTML, JSON]
  fill_zones: true

outputs:
  # ---------------- Fabrication ----------------
  - name: gerbers
    comment: Gerber files
    type: gerber
    dir: fab/gerbers
    options:
      use_protel_extensions: true
      subtract_mask_from_silk: true
      plot_footprint_values: false
    layers:
      - copper
      - F.Paste
      - B.Paste
      - F.SilkS
      - B.SilkS
      - F.Mask
      - B.Mask
      - Edge.Cuts

  - name: drill
    comment: Excellon drill files
    type: excellon
    dir: fab/gerbers
    options:
      map: gerber
      pth_and_npth_in_one_file: false

  - name: fab_zip
    comment: Zipped fabrication package (gerbers + drill)
    type: compress
    dir: fab
    options:
      output: '%f-%r-fab.zip'
      files:
        - from_output: gerbers
          dest: /
        - from_output: drill
          dest: /

  - name: bom_csv
    comment: Bill of materials (CSV, grouped)
    type: bom
    dir: fab
    options:
      format: CSV
      exclude_filter: '_mechanical'
      dnf_filter: '_kibom_dnf'
      columns:
        - field: References
          name: Designator
        - Quantity
        - Value
        - field: Footprint
          name: Footprint
        - Manufacturer
        - MPN
        - field: 'LCSC Part'
          name: 'LCSC Part #'
        - Datasheet

  - name: bom_html
    comment: Bill of materials (HTML)
    type: bom
    dir: fab
    options:
      format: HTML
      columns: [References, Quantity, Value, Footprint, Manufacturer, MPN, 'LCSC Part']

  - name: position
    comment: Pick-and-place centroid file
    type: position
    dir: fab
    options:
      format: CSV
      units: millimeters
      separate_files_for_front_and_back: false
      only_smd: false

  - name: ibom
    comment: Interactive HTML BOM
    type: ibom
    dir: fab
    options:
      dark_mode: false
      extra_fields: 'Manufacturer,MPN,LCSC Part'

  - name: netlist_ipc
    comment: IPC-2581 netlist
    type: netlist
    dir: fab
    options:
      format: ipc

  # ---------------- Review documents ----------------
  - name: schematic_pdf
    comment: Full schematic as PDF
    type: pdf_sch_print
    dir: docs

  - name: pcb_pdf
    comment: Per-layer PCB plots
    type: pcb_print
    dir: docs
    options:
      format: PDF
      pages:
        - layers: [{layer: F.Cu}, {layer: F.SilkS}, {layer: Edge.Cuts}]
          sheet: Top copper
        - layers: [{layer: In1.Cu}, {layer: Edge.Cuts}]
          sheet: Inner 1
        - layers: [{layer: In2.Cu}, {layer: Edge.Cuts}]
          sheet: Inner 2
        - layers: [{layer: B.Cu}, {layer: B.SilkS}, {layer: Edge.Cuts}]
          sheet: Bottom copper
          mirror: true
        - layers: [{layer: F.Fab}, {layer: Edge.Cuts}]
          sheet: Top assembly
        - layers: [{layer: B.Fab}, {layer: Edge.Cuts}]
          sheet: Bottom assembly
          mirror: true

  # ---------------- Mechanical ----------------
  - name: step
    comment: Board STEP model for enclosure and heatsink work
    type: step
    dir: mech
    options:
      metric_units: true
      origin: grid

  # ---------------- Renders ----------------
  - name: render_top
    comment: 3D render, top
    type: render_3d
    dir: renders
    options:
      view: top
      zoom: 4
      ray_tracing: true
      width: 1600
      height: 1200

  - name: render_bottom
    comment: 3D render, bottom
    type: render_3d
    dir: renders
    options:
      view: bottom
      zoom: 4
      ray_tracing: true
      width: 1600
      height: 1200

  - name: pcbdraw_top
    comment: Stylised 2D board drawing
    type: pcbdraw
    dir: renders
    options:
      format: png
      style: set-blue-enig
      show_components: all

  # ---------------- Netlist for README generation ----------------
  - name: netlist_xml
    comment: KiCad XML netlist (input to tools/gen_readme.py)
    type: netlist
    dir: meta
    options:
      format: classic
